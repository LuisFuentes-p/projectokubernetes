services:
  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    build:
      context: ../Transactionproducer
      dockerfile: dockerfile
    depends_on:
      - kafka
    
  producer2:
    build:
      context: ../Transactionproducer
      dockerfile: dockerfile
    depends_on:
      - kafka

  consumer:
    build:
      context: ../TransactionConsumer
      dockerfile: dockerfile
    depends_on:
      - kafka
    volumes:
      - ../transactions:/data


  dashboard:
    build:
      context: ../Dash
      dockerfile: dockerfile
    ports:
      - "8050:8050"
    depends_on:
      - consumer
    volumes:
    - ../transactions:/data

  kafka-exporter:
    image: danielqsj/kafka-exporter
    ports:
      - "9308:9308"
    environment:
      KAFKA_SERVER: kafka:9092
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml