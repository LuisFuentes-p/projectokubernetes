name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'TransactionProcessor/**'
      - 'TransactionConsumer/**'
      - 'Transactionproducer/**'
      - 'PricingService/**'
      - 'PricingConsumer/**'
      - 'Dash/**'
      - '.github/workflows/build-push-images.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'TransactionProcessor/**'
      - 'TransactionConsumer/**'
      - 'Transactionproducer/**'
      - 'PricingService/**'
      - 'PricingConsumer/**'
      - 'Dash/**'
      - '.github/workflows/build-push-images.yml'

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        service:
          - name: TransactionProcessor
            image: transaction-processor
            dockerfile: TransactionProcessor/dockerfile
          - name: TransactionConsumer
            image: transaction-consumer
            dockerfile: TransactionConsumer/dockerfile
          - name: Transactionproducer
            image: transaction-producer
            dockerfile: Transactionproducer/dockerfile
          - name: PricingService
            image: pricing-service
            dockerfile: PricingService/dockerfile
          - name: PricingConsumer
            image: pricing-consumer
            dockerfile: PricingConsumer/dockerfile
          - name: Dash
            image: dashboard
            dockerfile: Dash/dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image for PR (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
