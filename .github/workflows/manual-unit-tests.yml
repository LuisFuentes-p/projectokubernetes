name: Manual Unit Tests

on:
  workflow_dispatch:

jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PricingService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_pricing_logic tests.test_pricing_service_boundary

  processor-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TransactionProcessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_processor_logic tests.test_processor_boundary

  consumer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TransactionConsumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_consumer_logic tests.test_consumer_boundary

  producer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Transactionproducer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_producer_logic tests.test_producer_boundary
