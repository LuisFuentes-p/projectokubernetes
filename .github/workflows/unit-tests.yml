name: Unit Tests

on:
  push:
    branches:
      - main
      - develop

jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PricingService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_pricing_logic

  processor-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TransactionProcessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_processor_logic

  consumer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TransactionConsumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_consumer_logic

  producer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Transactionproducer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest tests.test_producer_logic
