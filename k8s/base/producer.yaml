apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: transaction-producer:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.trading-system.svc.cluster.local:9092