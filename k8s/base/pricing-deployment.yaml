apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
      - name: pricing
        image: phipho/pricing-service:latest
        imagePullPolicy: Always
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.trading-system.svc.cluster.local:9092