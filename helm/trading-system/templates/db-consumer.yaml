apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-consumer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-consumer
  template:
    metadata:
      labels:
        app: db-consumer
    spec:
      containers:
        - name: consumer
          image: phipho/transaction-consumer:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
            - name: POSTGRES_HOST
              value: pg-cluster-rw.{{ .Release.Namespace }}.svc.cluster.local
          envFrom:
            - secretRef:
                name: pg-cluster-app